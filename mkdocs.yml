site_name: "Beecrowd Potigol"
site_url: "https://potigol.github.io/beecrowd"
site_description: "Soluções para os problemas da Beecrowd utilizando a linguagem Potigol."
site_author: "Potigol"
repo_url: "https://github.com/potigol/beecrowd"
theme:
  name: material
  language: pt-BR
  palette:
    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange

    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple
  font:
    text: Roboto
    code: Source Code Pro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path

    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top

    - toc.follow

    - search.suggest
    - search.highlight

#    - navigation.footer
    - content.code.copy

nav:
  - Início: index.md

  - Soluções:
      - Problemas por número: problemas/README.md
      - "1000–1099": problemas/1000.md
      - "1100–1199": problemas/1100.md
      - "1200–1299": problemas/1200.md
      - "1300–1399": problemas/1300.md
      - "1400–1499": problemas/1400.md
      - "1500–1599": problemas/1500.md
      - "1600–1699": problemas/1600.md
      - "1700–1799": problemas/1700.md
      - "1800–1899": problemas/1800.md
      - "1900–1999": problemas/1900.md
      - "2000–2099": problemas/2000.md
      - "2100–2199": problemas/2100.md
      - "2200–2299": problemas/2200.md
      - "2300–2399": problemas/2300.md
      - "2400–2499": problemas/2400.md
      - "2500–2599": problemas/2500.md
      - "2600–2699": problemas/2600.md
      - "2700–2799": problemas/2700.md
      - "2800–2899": problemas/2800.md
      - "2900–2999": problemas/2900.md
      - "3000–3099": problemas/3000.md
      - "3100–3199": problemas/3100.md
      - "3200–3299": problemas/3200.md
      - "3300–3399": problemas/3300.md
      - "3400–3499": problemas/3400.md
      - "3500–3599": problemas/3500.md

      # Continuar com as demais faixas

  - Categorias:
      - categorias/README.md
      - Iniciante: categorias/iniciante.md
      - Ad-Hoc: categorias/adhoc.md
      - Strings: categorias/strings.md
      - Estruturas e Bibliotecas: categorias/estruturasebibliotecas.md
      - Matemática: categorias/matemática.md
      - Paradigmas: categorias/paradigmas.md
      - Grafos: categorias/grafos.md
      - Geometria Computacional: categorias/geometriacomputacional.md

  - Competições:
      - competicoes/README.md
      - Maratona SBC: competicoes/maratona/README.md
      - OBI: competicoes/obi/README.md
      - OLIP: competicoes/olip/README.md
      - Fase Zero: competicoes/fasezero/README.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/potigol
    - icon: material/twitter
      link: https://twitter.com/potigol

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - codehilite:
      use_pygments: true
      pygments_style: material
      linenums: true
  - tables
  - admonition
  - attr_list
  - md_in_html
